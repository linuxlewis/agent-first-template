services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-first-template:production
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-app}
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 4000
      STATIC_ROOT: /app/dist/app
    ports:
      - "${APP_PORT:-8080}:4000"
    command: sh -c "node dist/server/db-migrate.mjs && node dist/server/prod-server.mjs"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  prod_pgdata:
